; AMS-X cluster controller — ESP32 firmware (scaffold).
; One ESP32 per cluster, drives <=16 modules (one TMC2209 per module), one-motor-at-a-time.
; Talks to the Brain over WiFi -> MQTT (same bus as the printers). See docs/02 + docs/08.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Libraries to add when firmware work starts (left commented at scaffold time):
; lib_deps =
;   knolleary/PubSubClient        ; MQTT client
;   teemuatlut/TMCStepper         ; TMC2209 (UART config, StallGuard)
;   bblanchon/ArduinoJson         ; command/status payloads

; Keep real WiFi creds OUT of source — use build flags from an untracked file later, e.g.:
; build_flags = -DWIFI_SSID=\"...\" -DWIFI_PASS=\"...\"
