# AMS-X simulate config — NO real printer, NO secrets. Safe to commit.
#
# Use this to drive the whole v0 stack in simulate mode (SimulatedPrinterLink +
# SimulatedFtpClient). The printer model is `x1` on purpose: the X1P1Driver returns
# (guessed) request payloads that the simulator simply records, so the swap loop runs
# end-to-end. The real `Bedroom` printer is an A1 mini whose write-path driver is still
# @todo (raises), so it cannot complete a simulated swap yet — that's blocker #2, not a
# test problem. Run:
#
#   AMSX_SIMULATE=1 AMSX_CONFIG=config/ams.sim.yaml AMSX_PORT=9001 uv run amsx
#
# then point scripts/test_v0_api.py at http://127.0.0.1:9001.

bus:
  host: 127.0.0.1
  port: 1883

printers:
  - id: sim-x1
    model: x1                 # x1 driver: write payloads are recorded, not executed
    serial: "SIM0000000000000"
    access_code: "sim"        # never used in simulate mode
    ip: "127.0.0.1"

clusters:
  - id: cluster-a
    mqtt_topic: amsx/cluster-a
    module_ids: [m1, m2, m3, m4]

modules:
  - { id: m1, cluster_id: cluster-a, filament_index: 0, spool_ref: null }
  - { id: m2, cluster_id: cluster-a, filament_index: 1, spool_ref: null }
  - { id: m3, cluster_id: cluster-a, filament_index: 2, spool_ref: null }
  - { id: m4, cluster_id: cluster-a, filament_index: 3, spool_ref: null }

hub:
  sim-x1: { type: y-connector, inputs: 4 }
