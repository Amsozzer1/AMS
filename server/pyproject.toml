[project]
name = "amsx"
version = "0.0.0"
description = "AMS-X — the Brain: server that automates the Bambu external-spool swap over MQTT."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "AMS-X" }]

# Runtime deps are intentionally minimal at scaffold time; add as layers are built.
dependencies = [
    "fastapi>=0.115",          # api/ — dashboard, 3MF upload, live state
    "uvicorn[standard]>=0.32", # ASGI server
    "python-multipart>=0.0.9", # api/ — multipart 3MF upload (FastAPI UploadFile)
    "paho-mqtt>=2.1",          # transport/ — our own MQTT bus (printers + clusters)
    "pydantic>=2.9",           # typed models for the domain layer
    "pydantic-settings>=2.5",  # config/ loading
    "httpx>=0.27",             # inventory/ — Spoolman REST (later)
    "defusedxml>=0.7",         # job/ — XXE/billion-laughs-safe XML parse of 3MF metadata
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "import-linter>=2.0",      # RULE 1 — fails CI on a sideways/upward import
    "ty>=0.0.1a1",             # Astral type checker (preview)
    "pytest>=8.3",
    "pytest-asyncio>=0.24",    # orchestrator is async
    "pre-commit>=4.0",
]

[project.scripts]
amsx = "amsx.__main__:main"     # entrypoint placeholder (Brain.start) — not yet implemented

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amsx"]

# ---- Ruff (lint + format) ----
[tool.ruff]
line-length = 100
src = [".", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

# ---- ty (type checker) ----
[tool.ty]

# defaults are fine for now; src layout is auto-detected

# ---- import-linter: RULE 1 enforced mechanically (docs/rules/01-separation-of-concerns.md) ----
# The layering was previously guarded only by review. This makes a violation fail, so the rule
# survives a tired evening, a new contributor, and any model.
[tool.importlinter]
root_package = "amsx"

[[tool.importlinter.contracts]]
name = "amsx layers: nothing imports upward"
type = "layers"
layers = [
    "amsx.api",
    "amsx.brain",
    "amsx.orchestration",
    "amsx.printer",
    "amsx.transport | amsx.job | amsx.module | amsx.inventory",
    "amsx.events",
    "amsx.types",
    "amsx.enums | amsx.errors | amsx.utils | amsx.config",
]

# amsx.protocols was folded into amsx.types (all seams in one file), so `types` now sits on its
# own layer above `enums` — it names the enums in the protocol signatures.
[[tool.importlinter.contracts]]
name = "the kernel stays dependency-free"
type = "independence"
modules = ["amsx.enums", "amsx.errors", "amsx.utils", "amsx.config"]

[[tool.importlinter.contracts]]
name = "orchestration depends on seams, never on concrete implementations"
type = "forbidden"
source_modules = ["amsx.orchestration"]
forbidden_modules = ["amsx.printer", "amsx.transport", "amsx.brain", "amsx.api"]
