# Pre-commit hooks. Install once:  pip install pre-commit && pre-commit install
# Runs on every commit. The gitleaks hook BLOCKS commits that contain secrets.
repos:
  # --- Secret scanning (the safety net) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- General hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key          # blocks committed private keys
      - id: check-added-large-files      # blocks accidental large blobs
        args: ["--maxkb=2048"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict

  # --- Python lint + format (server/) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
